<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hanoia's new product concept | Bui Bich Phuong</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--cream:#FDF8F0;--peach:#F5E6D3;--coral:#E8916A;--mint:#C8E6C9;--lavender:#E8E0F5;--blue-soft:#D0E8F5;--text-dark:#2A1F1A;--text-mid:#5C4A3A;--text-light:#8C7A6A;--border:#E8D8C8;--bg-card:#FFFFFF}
body{font-family:'Manrope',sans-serif;background:var(--cream);color:var(--text-dark);line-height:1.7}
.page{max-width:980px;margin:0 auto;padding:3rem 1.5rem 5rem}
.back{display:inline-flex;align-items:center;gap:0.4rem;color:var(--coral);text-decoration:none;font-weight:700;margin-bottom:2rem}
.hero-img{width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:20px;border:1.5px solid var(--border);display:block;margin-bottom:2rem}
.label{font-size:0.78rem;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:var(--coral);margin-bottom:0.6rem}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;letter-spacing:-0.03em;margin-bottom:1.5rem}
.content{background:var(--bg-card);border:1.5px solid var(--border);border-radius:20px;padding:2rem}
.content h2{font-size:1.1rem;margin-bottom:0.8rem;color:var(--text-dark)}
.content p{color:var(--text-mid);margin-bottom:1.5rem}
.placeholder{border-top:1px solid var(--border);padding-top:1.5rem;color:var(--text-light)}
@media(max-width:640px){.page{padding:2rem 1rem 4rem}.content{padding:1.4rem}h1{font-size:2rem}}
</style>
</head>
<body>
<main class="page">
  <a class="back" href="index.html#portfolio">← Back to portfolio</a>
  <img class="hero-img" src="assets/project-hanoia.png" alt="Hanoia's new product concept preview">
  <div class="label">Marketing Proposals</div>
  <h1>Hanoia's new product concept</h1>
  <section class="content" aria-label="Project details">
    <h2>Description</h2>
    <p>Project description will be updated soon.</p>
    <h2>Detailed Information</h2>
    <p class="placeholder">Detailed information will be added later.</p>
  </section>
</main>
</body>
</html>
